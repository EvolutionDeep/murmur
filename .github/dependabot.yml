# Dependabot keeps dependencies and CI actions current.
# The project ships simulated & keyless by default, so dependency freshness is
# the main ongoing maintenance surface (see `npm audit` notes in the README).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
