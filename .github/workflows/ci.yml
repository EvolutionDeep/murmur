name: CI

# Runs the four project gates — typecheck, unit tests, build, and the neural smoke
# test — on every push to main and every pull request. All four are keyless and
# chain-free (the unit tests exercise the connectome, LIF dynamics, motor decoding
# and the simulated economy in-process), so CI never needs a secret or a funded wallet.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build · neural smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (connectome · LIF · motor decoder · economy)
        run: npm test

      - name: Build (@fly/fly-brain → dist)
        run: npm run build

      - name: Neural smoke test
        run: npm run smoke
