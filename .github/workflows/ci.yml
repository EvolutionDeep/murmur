name: CI

# Runs the project gates on every push to main, every pull request, and on demand:
#   • verify    — typecheck, unit tests, build, the neural smoke test, and the brain-manifest replay
#                 (keyless, chain-free: the unit tests exercise the connectome, LIF dynamics, motor
#                 decoding and the simulated economy in-process, so CI never needs a secret or a funded
#                 wallet). The replay rebuilds every fly's connectome from the committed seeds in
#                 wrangler.toml and asserts each structural spec reproduces — a standing trustless check
#                 that the published brain is exactly what its seeds deterministically generate (no LLM).
#   • contracts — the on-chain Solidity suites (NeuralReceiptRegistry + NeuralManifestRegistry +
#                 PredictionArena) under forge, including the fuzz invariants that prove the receipt
#                 hash-chain stays contiguous and the brain-manifest anchor is immutable.
#   • fly-brain-rs — bit-exact parity of the Rust port (packages/fly-brain-rs) with fly-brain:
#                 regenerates the numeric traces from the TypeScript on the runner and replays them
#                 in Rust with no tolerance, on both an x86-64 and an arm64 runner (the two differ in
#                 the last bit of Math.log/cos/tanh; see packages/fly-brain-rs/README.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build · neural smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (connectome · LIF · motor decoder · economy · provenance · ipfs)
        run: npm test

      - name: Build (@fly/fly-brain → dist)
        run: npm run build

      - name: Neural smoke test
        run: npm run smoke

      # Standing trustless gate: rebuild the production (10x, from wrangler.toml) brain manifest offline
      # and assert every fly's connectome reproduces from its committed seed. Exits non-zero on any
      # mismatch, so a change that breaks connectome determinism — or a tampered manifest — fails CI.
      - name: Brain-manifest replay (prove the brain, offline)
        run: npm run replay

  contracts:
    name: forge · registry + manifest + arena (unit + fuzz invariants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/trader-worker/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # forge-std is not vendored (no lib/, no .gitmodules). Clone a PINNED tag deterministically
      # rather than `forge install`: this sidesteps git-submodule / detached-HEAD behaviour entirely
      # and locks the version so the suite can't drift with a forge-std HEAD change. v1.9.4 is
      # contemporaneous with solc 0.8.24. The existing remapping forge-std/=lib/forge-std/src/
      # (foundry.toml) resolves against this path; solc 0.8.24 is auto-fetched by foundry's svm.
      - name: Install forge-std (pinned v1.9.4)
        run: git clone --depth 1 --branch v1.9.4 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Run forge tests
        run: forge test -vvv

  fly-brain-rs:
    name: fly-brain-rs · bit-exact parity with fly-brain (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official x86-64 Node binaries carry V8's fdlibm with NO fused multiply-adds (baseline
          # x86-64 has no FMA instruction for the compiler to contract to), so the port is built
          # with its `fma` feature off here. Apple-silicon Node is clang-contracted → default.
          - os: ubuntu-latest
            label: x86-64 · fma off
            cargo_flags: --no-default-features
          - os: macos-latest
            label: arm64 · fma on
            cargo_flags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Traces from the TypeScript reference, generated on THIS runner's Node build so the last-bit
      # transcendental behaviour of the fixtures matches the runner. fly-brain has no runtime
      # dependency, so no npm ci is needed; tsx is fetched by npx.
      - name: Generate parity fixtures from packages/fly-brain
        run: npx --yes tsx packages/fly-brain-rs/tests/gen/gen_fixtures.ts

      - name: rustfmt · clippy (-D warnings)
        working-directory: packages/fly-brain-rs
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets ${{ matrix.cargo_flags }} -- -D warnings

      - name: Parity suite (cargo test --release)
        working-directory: packages/fly-brain-rs
        run: cargo test --release ${{ matrix.cargo_flags }}

      - name: Core builds for wasm32-unknown-unknown
        working-directory: packages/fly-brain-rs
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown ${{ matrix.cargo_flags }}
