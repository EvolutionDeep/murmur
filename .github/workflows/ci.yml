name: CI

# Runs the project gates on every push to main, every pull request, and on demand:
#   • verify    — typecheck, unit tests, build, and the neural smoke test (keyless, chain-free:
#                 the unit tests exercise the connectome, LIF dynamics, motor decoding and the
#                 simulated economy in-process, so CI never needs a secret or a funded wallet).
#   • contracts — the on-chain Solidity suites (NeuralReceiptRegistry + PredictionArena) under forge,
#                 including the fuzz invariants that prove the receipt hash-chain stays contiguous.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build · neural smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (connectome · LIF · motor decoder · economy · provenance · ipfs)
        run: npm test

      - name: Build (@fly/fly-brain → dist)
        run: npm run build

      - name: Neural smoke test
        run: npm run smoke

  contracts:
    name: forge · registry + arena (unit + fuzz invariants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/trader-worker/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # forge-std is not vendored (no lib/, no .gitmodules). Clone a PINNED tag deterministically
      # rather than `forge install`: this sidesteps git-submodule / detached-HEAD behaviour entirely
      # and locks the version so the suite can't drift with a forge-std HEAD change. v1.9.4 is
      # contemporaneous with solc 0.8.24. The existing remapping forge-std/=lib/forge-std/src/
      # (foundry.toml) resolves against this path; solc 0.8.24 is auto-fetched by foundry's svm.
      - name: Install forge-std (pinned v1.9.4)
        run: git clone --depth 1 --branch v1.9.4 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Run forge tests
        run: forge test -vvv
