name = "murmur"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# ---------- Custom domain: the Worker API on the project's own zone ----------
# api.muros.live → this Worker. A custom domain (not *.workers.dev) means the deployed frontend at
# muros.live can reach the API even on networks that DNS-sinkhole workers.dev. Cloudflare provisions
# the DNS record + SSL automatically on deploy (the muros.live zone is in this account).
routes = [
  { pattern = "api.muros.live", custom_domain = true }
]

# Cron: observe Arc, update the market temperature and let the fly population react — every minute
# (Cloudflare's minimum cron granularity). Each run reads whole-chain activity and advances the sim.
[triggers]
crons = ["* * * * *"]

# ---------- Variables (non-sensitive, committed with the code) ----------
# PRODUCTION IS LIVE WITH REAL MONEY: ECONOMY_FACILITATOR = "onchain" and ECONOMY_SHADOW = "false" below,
# so this Worker READS Arc chain data for the market temperature AND WRITES real EIP-3009 USDC transfers
# between the fly agents. That requires secrets set out-of-band with `wrangler secret put` (NEVER committed
# here): ECONOMY_MNEMONIC, optionally ECONOMY_FACILITATOR_PK, and ALCHEMY_ARC_RPC_URL. A fresh checkout with
# NO mnemonic transparently falls back to the keyless simulated economy. See the real-money block below.
[vars]
# ===== Arc chain =====
# Deployed to Arc MAINNET (Chain ID 5042). The public mainnet RPC is reachable and serves live
# blocks — verified from the dev machine: eth_chainId=0x13b2 (5042), eth_blockNumber ~21.25M,
# eth_getBlockByNumber(latest) returns real txs/gas. Reads derive the market temperature; the relay
# wallet also WRITES the agents' real EIP-3009 USDC transfers (see ECONOMY_FACILITATOR below).
CHAIN_ID = "5042"                             # 5042 = Arc mainnet · 5042002 = Arc testnet
RPC_URL = "https://rpc.mainnet.arc.io"        # Arc mainnet public RPC

# ===== Market temperature (Arc whole-chain activity) =====
MARKET_SAMPLE_BLOCKS = "16"                   # recent blocks sampled per cron for tx/gas throughput
MARKET_EWMA_ALPHA = "0.08"                    # baseline smoothing (slow ⇒ tracks the regime, not spikes)
MARKET_GAIN = "3.0"                           # logistic sharpness ratio→temperature (calibrated on live Arc)
REGIME_HOT = "0.66"                           # temperature ≥ this ⇒ HOT
REGIME_COLD = "0.33"                          # temperature ≤ this ⇒ COLD

# ===== Fly population =====
POPULATION_SIZE = "24"                        # number of flies in the swarm (1–256)
POPULATION_SEED_BASE = "42"                   # base seed; fly i uses seed = base + i*7919
TICKS_PER_CRON = "6"                          # simulation sub-ticks per cron
SIM_STEPS_PER_TICK = "500"                    # total LIF integration steps per cron, split across sub-ticks

# ===== Visitor stimulus ("poke the swarm") =====
STIMULUS_COOLDOWN_SEC = "30"                  # one injection per visitor per N seconds
FRONTEND_ORIGIN = "*"                         # CORS origin for the frontend

# ===== Agent economy (x402 micropayments between fly agents) =====
# Every fly is an autonomous agent with its own USDC micro-wallet; its neural drives decide what to buy and
# from whom, and agents settle over x402. LIVE IN PRODUCTION: ECONOMY_FACILITATOR = "onchain" settles real
# EIP-3009 USDC transfers (src/x402.ts) signed by each buyer's HD-derived key and relayed on-chain. Set
# ECONOMY_FACILITATOR = "simulated" (or run without the ECONOMY_MNEMONIC secret) for the keyless local-dev
# ledger, where no wallet, no key and no real funds are involved.
ECONOMY_ENABLED = "true"                      # agent economy on/off (off ⇒ pure reactive population)
ECONOMY_INITIAL_BALANCE = "6"                # starting USDC per agent wallet
ECONOMY_BASE_PRICE = "0.002"                  # base price of one good (USDC) before neural/market scaling
ECONOMY_SOLVENCY_FLOOR = "0.5"                # simulated treasury tops an agent up to this when it runs dry
ECONOMY_MAX_DEALS = "10"                   # per-CRON settlement budget, spread across the 6 sub-ticks — 5× the old 2/cron rate
ECONOMY_FACILITATOR = "onchain"             # "simulated" (keyless ledger) | "onchain" (real EIP-3009; needs the block below)

# ===== Real-money (ONCHAIN) settlement — LIVE: ECONOMY_SHADOW = "false" broadcasts real USDC transfers
#       on Arc mainnet, bounded by the caps + kill switch below. The path was proven first in SHADOW mode
#       (sign + eth_call against live chain state, never broadcast) before a single wei went out. To halt
#       everything instantly set ECONOMY_REAL_SPEND = "false"; to go back to dry-run set ECONOMY_SHADOW =
#       "true". These lines do nothing while ECONOMY_FACILITATOR = "simulated" (the keyless local-dev mode). =====
# SECRETS — set with `wrangler secret put <NAME>`, NEVER written into this file:
#   ECONOMY_MNEMONIC        one BIP-39 seed → HD-derives all agent wallets (m/44'/60'/0'/0/{id}) + gas wallet
#   ECONOMY_FACILITATOR_PK  optional dedicated gas-wallet key (else the gas wallet is derived from the seed)
#   ALCHEMY_ARC_RPC_URL     complete private Alchemy Arc mainnet HTTPS endpoint
# Non-sensitive rails (safe to commit; uncomment to override the coded defaults in src/config.ts):
# ECONOMY_REAL_SPEND = "true"                 # kill switch: set "false" to halt ALL real settlement instantly
ECONOMY_SHADOW = "false"                    # LIVE: real EIP-3009 USDC transfers are broadcast on Arc mainnet, under the caps + kill switch below
ECONOMY_DAILY_CAP = "100"                   # global real-spend ceiling per UTC day (USDC); raised 5× with the trade rate so 10/min isn't throttled; 0 = no cap
ECONOMY_PER_AGENT_DAILY_CAP = "10"          # per-agent real-spend ceiling per UTC day (USDC); raised 5× with the trade rate; 0 = no cap
# ECONOMY_MAX_DEAL = "0.05"                   # facilitator hard per-deal ceiling (USDC)
# ECONOMY_GAS_PRICE_GWEI = "20"               # pin relay gas (Arc launched ~20 gwei); omit = let viem estimate
# ECONOMY_USDC_EIP712_NAME = "USDC"           # EIP-712 domain name (probe: name()="USDC"); tune if signatures revert
# ECONOMY_USDC_EIP712_VERSION = "2"           # EIP-712 domain version (probe: version()="2")

# ===== Settlement NETTING (ONCHAIN ONLY — gas amortisation) =====
# Trades no longer broadcast one tx per micropay: each pair's signed net accumulates in the DO and is
# flushed at most once per cron, only when |net| ≥ MIN_BROADCAST or the net has aged ≥ FLUSH_TICKS
# sub-ticks. Reciprocal trades cancel (net=0 ⇒ zero tx), dust carries forward, and nets above
# ECONOMY_MAX_DEAL split into chunks. The internal ledger/volume/caps move ONLY on a mined receipt,
# so a failed flush never invents money. Inert in simulated mode.
ECONOMY_NET_MIN_BROADCAST = "0.004"          # min |net| (USDC) before a pair is broadcast; below ⇒ dust carries forward (~2× base price, so gas stays a minority of face value)
ECONOMY_NET_FLUSH_TICKS = "30"               # force-flush any nonzero pending net at least every N sub-ticks (30 = 5 crons ≈ 5 min); 0 = never force


# ===== Brain backend =====
# "ts-lif"     → default, pure-TS ~1,080-neuron spiking connectome (what the behaviour was tuned on)
# "wasm-flyai" → load a real fly.ai WASM module (requires WASM_MODULE_URL)
# "wasm-mock"  → TS-simulated large sparse LIF
BRAIN_BACKEND = "ts-lif"
WASM_MODULE_URL = ""
WASM_NEURON_COUNT = "0"

# ===== TS-LIF connectome sizing (optional; omitted ⇒ ~1,080-neuron default) =====
# Left at defaults to match the calibrated behaviour and keep the per-cron CPU budget small.
# BRAIN_N_SENSORY = "180"
# BRAIN_N_INTER_L1 = "400"
# BRAIN_N_INTER_L2 = "400"
# BRAIN_N_MODULATORY = "40"
# BRAIN_N_MOTOR_PER_CHANNEL = "12"
# BRAIN_DENSITY = "0.02"

# ---------- Durable Object: population + market state ----------
[[durable_objects.bindings]]
name = "FLY_STATE"
class_name = "FlyStateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlyStateDO"]

# ---------- Optional: D1 database for long-term archival of market/population snapshots ----------
# [[d1_databases]]
# binding = "DB"
# database_name = "murmur-db"
# database_id = ""

# ---------- Observability ----------
[observability]
enabled = true
head_sampling_rate = 1
