name = "murmur"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# ---------- Custom domain: the Worker API on the project's own zone ----------
# api.muros.live → this Worker. A custom domain (not *.workers.dev) means the deployed frontend at
# muros.live can reach the API even on networks that DNS-sinkhole workers.dev. Cloudflare provisions
# the DNS record + SSL automatically on deploy (the muros.live zone is in this account).
routes = [
  { pattern = "api.muros.live", custom_domain = true }
]

# Cron: observe Arc, update the market temperature and let the fly population react — every minute
# (Cloudflare's minimum cron granularity). Each run reads whole-chain activity and advances the sim.
[triggers]
crons = ["* * * * *"]

# ---------- Variables (non-sensitive, committed with the code) ----------
# PRODUCTION PHASE — 10x LIVE. The swarm runs 10,800-neuron brains sharded across 12 FlyShardDO isolates
# (SHARD_COUNT = "12" + the connectome sizing below), and ECONOMY_SHADOW = "false" so every netted transfer is
# a REAL EIP-3009 USDC broadcast on Arc mainnet, bounded by the daily/per-agent caps + kill switch below. The
# 10x behaviour decoder is recalibrated (band collapse fixed: inject() normalises against a fixed reference
# channel size and proboscis uses a fixed fan-in, so all 5 motor channels stay live and unsaturated at 10x).
# ECONOMY_FACILITATOR stays "onchain" and the mnemonic/keys stay fully wired; set ECONOMY_SHADOW = "true" to
# fall back to sign + eth_call simulation with no broadcast. Secrets (NEVER committed): ECONOMY_MNEMONIC,
# optionally ECONOMY_FACILITATOR_PK, ALCHEMY_ARC_RPC_URL. A fresh checkout with NO mnemonic falls back to sim.
[vars]
# ===== Arc chain =====
# Deployed to Arc MAINNET (Chain ID 5042). The public mainnet RPC is reachable and serves live
# blocks — verified from the dev machine: eth_chainId=0x13b2 (5042), eth_blockNumber ~21.25M,
# eth_getBlockByNumber(latest) returns real txs/gas. Reads derive the market temperature; the relay
# wallet also WRITES the agents' real EIP-3009 USDC transfers (see ECONOMY_FACILITATOR below).
CHAIN_ID = "5042"                             # 5042 = Arc mainnet · 5042002 = Arc testnet
RPC_URL = "https://rpc.mainnet.arc.io"        # Arc mainnet public RPC

# ===== Market temperature (Arc whole-chain activity) =====
MARKET_SAMPLE_BLOCKS = "16"                   # recent blocks sampled per cron for tx/gas throughput
MARKET_EWMA_ALPHA = "0.08"                    # baseline smoothing (slow ⇒ tracks the regime, not spikes)
MARKET_GAIN = "3.0"                           # logistic sharpness ratio→temperature (calibrated on live Arc)
REGIME_HOT = "0.66"                           # temperature ≥ this ⇒ HOT
REGIME_COLD = "0.33"                          # temperature ≤ this ⇒ COLD

# ===== Fly population =====
POPULATION_SIZE = "24"                        # number of flies in the swarm (1–256)
POPULATION_SEED_BASE = "42"                   # base seed; fly i uses seed = base + i*7919
TICKS_PER_CRON = "6"                          # simulation sub-ticks per cron
SIM_STEPS_PER_TICK = "500"                    # total LIF integration steps per cron, split across sub-ticks
# Swarm sharding (see swarm.ts / shard.ts). "1" = the original single-DO swarm — every brain in FlyStateDO,
# the FLY_SHARD binding inert (ZERO shards). "12" fans the HEAVY per-fly LIF advance out to 12 FlyShardDO
# isolates (2 flies each at POPULATION_SIZE=24), each with its own 128 MB + CPU budget and its own SQLite,
# so each brain can grow past the single-isolate memory ceiling. Only the compact motor/sensory read-out
# crosses the boundary, so the coordinator stays small at any size. 12 is the MEASURED floor for the
# 10,800-neuron brains below: 2 flies/shard serialise to ~1.4 MB (under the 2 MB single-value cap) and fan
# out safely (Cloudflare QUEUES subrequests past the 6th, never rejects). Rollback = set this back to "1".
SHARD_COUNT = "12"

# ===== Visitor stimulus ("poke the swarm") =====
STIMULUS_COOLDOWN_SEC = "30"                  # one injection per visitor per N seconds
FRONTEND_ORIGIN = "*"                         # CORS origin for the frontend

# ===== Agent economy (x402 micropayments between fly agents) =====
# Every fly is an autonomous agent with its own USDC micro-wallet; its neural drives decide what to buy and
# from whom, and agents settle over x402. LIVE IN PRODUCTION: ECONOMY_FACILITATOR = "onchain" settles real
# EIP-3009 USDC transfers (src/x402.ts) signed by each buyer's HD-derived key and relayed on-chain. Set
# ECONOMY_FACILITATOR = "simulated" (or run without the ECONOMY_MNEMONIC secret) for the keyless local-dev
# ledger, where no wallet, no key and no real funds are involved.
ECONOMY_ENABLED = "true"                      # agent economy on/off (off ⇒ pure reactive population)
ECONOMY_INITIAL_BALANCE = "6"                # starting USDC per agent wallet
ECONOMY_BASE_PRICE = "0.002"                  # base price of one good (USDC) before neural/market scaling
ECONOMY_SOLVENCY_FLOOR = "0.5"                # simulated treasury tops an agent up to this when it runs dry
ECONOMY_MAX_DEALS = "10"                   # per-CRON settlement budget, spread across the 6 sub-ticks — 5× the old 2/cron rate
ECONOMY_FACILITATOR = "onchain"             # "simulated" (keyless ledger) | "onchain" (real EIP-3009; needs the block below)

# ===== Real-money (ONCHAIN) settlement — LIVE: ECONOMY_SHADOW = "false" broadcasts every netted transfer as a
#       real EIP-3009 USDC tx on Arc mainnet (bounded by the caps + kill switch below). The onchain path + HD
#       keys are fully wired; set ECONOMY_SHADOW = "true" to sign + eth_call-simulate without broadcasting. To
#       halt everything instantly set ECONOMY_REAL_SPEND = "false". These lines do nothing while
#       ECONOMY_FACILITATOR = "simulated" (the keyless local-dev mode). =====
# SECRETS — set with `wrangler secret put <NAME>`, NEVER written into this file:
#   ECONOMY_MNEMONIC        one BIP-39 seed → HD-derives all agent wallets (m/44'/60'/0'/0/{id}) + gas wallet
#   ECONOMY_FACILITATOR_PK  optional dedicated gas-wallet key (else the gas wallet is derived from the seed)
#   ALCHEMY_ARC_RPC_URL     complete private Alchemy Arc mainnet HTTPS endpoint
#   ADMIN_TOKEN             optional: when set, POST /tick + /reset require it (locks the debug endpoints)
# Non-sensitive rails (safe to commit; uncomment to override the coded defaults in src/config.ts):
# ECONOMY_REAL_SPEND = "true"                 # kill switch: set "false" to halt ALL real settlement instantly
ECONOMY_SHADOW = "false"                    # LIVE: real EIP-3009 USDC transfers are broadcast on Arc mainnet (bounded by the caps + kill switch above); set "true" to sign + eth_call each transfer but broadcast nothing
ECONOMY_DAILY_CAP = "100"                   # global real-spend ceiling per UTC day (USDC); raised 5× with the trade rate so 10/min isn't throttled; 0 = no cap
ECONOMY_PER_AGENT_DAILY_CAP = "10"          # per-agent real-spend ceiling per UTC day (USDC); raised 5× with the trade rate; 0 = no cap
# ECONOMY_MAX_DEAL = "0.05"                   # facilitator hard per-deal ceiling (USDC)
# ECONOMY_GAS_PRICE_GWEI = "20"               # pin relay gas (Arc launched ~20 gwei); omit = let viem estimate
# ECONOMY_USDC_EIP712_NAME = "USDC"           # EIP-712 domain name (probe: name()="USDC"); tune if signatures revert
# ECONOMY_USDC_EIP712_VERSION = "2"           # EIP-712 domain version (probe: version()="2")

# ===== Settlement NETTING (ONCHAIN ONLY — gas amortisation) =====
# Trades no longer broadcast one tx per micropay: each pair's signed net accumulates in the DO and is
# flushed at most once per cron, only when |net| ≥ MIN_BROADCAST or the net has aged ≥ FLUSH_TICKS
# sub-ticks. Reciprocal trades cancel (net=0 ⇒ zero tx), dust carries forward, and nets above
# ECONOMY_MAX_DEAL split into chunks. The internal ledger/volume/caps move ONLY on a mined receipt,
# so a failed flush never invents money. Inert in simulated mode.
ECONOMY_NET_MIN_BROADCAST = "0.004"          # min |net| (USDC) before a pair is broadcast; below ⇒ dust carries forward (~2× base price, so gas stays a minority of face value)
ECONOMY_NET_FLUSH_TICKS = "30"               # force-flush any nonzero pending net at least every N sub-ticks (30 = 5 crons ≈ 5 min); 0 = never force

# ===== Neural-receipt REGISTRY (ONCHAIN ONLY — trustless chain head) =====
# Deploy contracts/NeuralReceiptRegistry.sol (see contracts/README.md), then set this to its address.
# When set, each mined net is committed on-chain right after its EIP-3009 transfer, so the receipt
# HASH-CHAIN HEAD lives on Arc and any verifier can rebuild the ordered chain from RPC events alone —
# no murmur server in the loop. Absent ⇒ the commit step is skipped entirely (zero behaviour change).
ECONOMY_REGISTRY_ADDRESS = "0x94d0c38bcc9957eaf8f318e6bbc6557f8cc3c815"   # deployed on Arc mainnet (5042); committer = the Worker's facilitator wallet


# ===== Circle Facilitator Service (the OFFICIAL hosted x402 facilitator — src/circle.ts) =====
# Circle now hosts the exact role murmur self-built: its relayer screens both parties, submits the buyer's
# EIP-3009 USDC transfer and PAYS the settlement gas — "no relayer keys, no separate gas wallet". This block
# delegates ONLY the per-deal USDC broadcast to Circle; the NeuralReceiptRegistry commits + PredictionArena
# open/resolve are not USDC transfers, so they always still use murmur's own facilitator wallet (0x2b9a…055c).
# CURRENT: "external" (mode line below) — LIVE on Arc MAINNET, verified with a zero-value keyless probe:
# Circle accepted our EIP-712 seller proof + x402v2 body and reached the balance check (HTTP 200,
# insufficient_funds for the 0-balance test buyer), so the hosted keyless path is correct. "off" ⇒ self-broadcast.
# The buyer still signs the SAME EIP-3009 authorization; only the network string is translated to CAIP-2
# (eip155:5042 mainnet / eip155:5042002 testnet) for Circle's routing, which never invalidates a signature.
# ROLLOUT (done): straight to Arc MAINNET "external" (Arc Pulse seller side only), keyless — probe-verified
# above. The internal agent economy still self-broadcasts; only flip to "all" after external proves out under
# real traffic (that puts the core hot path on an external API). The keyless trial is rate-limited per payTo
# and returns 403 registration_required once exhausted — for sustained high-volume mainnet use, add a Circle
# API key (secret below) so auth switches to Bearer. Rollback = set the mode back to "off" and redeploy.
ECONOMY_CIRCLE_FACILITATOR = "external"     # LIVE: Arc Pulse seller side settles via Circle's relayer (keyless trial; payTo 0x2b9a…055c signs the seller proof, Circle pays gas). Internal agent economy still self-broadcasts. "off"=self-broadcast all · "all"=+internal economy. Inert unless ECONOMY_FACILITATOR="onchain".
CIRCLE_FACILITATOR_URL = "https://api.circle.com"   # Circle API base URL; sandbox = https://api-sandbox.circle.com. One host routes testnet+mainnet by the CAIP-2 network in the body.
CIRCLE_MAX_TIMEOUT_SECONDS = "12"           # seconds Circle may wait for terminal settlement before returning "pending" (Arc settles with instant finality)
# SECRET (optional) — set with `wrangler secret put CIRCLE_API_KEY`, NEVER written here: a Circle API key for
# Bearer auth in production. Absent ⇒ keyless trial, authenticating each settle with an EIP-712 seller proof
# signed by the payTo key murmur already holds. Mixing Bearer + seller-proof on one request is a 400.


# ===== Prediction market (ONCHAIN — neural-staked temperature bets) =====
# Each cron the swarm stakes real USDC on whether next tick's market temperature rises or falls; the
# following cron resolves it parimutuel (winners split the losers' pool, strictly zero-sum) and folds the
# net PnL through the SAME netting / EIP-3009 / registry path as every other settlement — no new spend
# rail, bounded by the daily/per-agent caps + kill switch above. Decisive resolutions are committed to the
# registry above (one extra registry tx/cron, only when the round is decisive and has participants).
# ROLLOUT: was deployed once with PREDICT_ENABLED = "false" to prove the /predictions plumbing live without
# moving a satoshi (verified: /predictions ⇒ {enabled:false}, /predictions/verify ⇒ 400, frontend v18 drawer
# OK, economy unregressed), then flipped to "true" and redeployed to go live. Stakes are tiny (base 0.002,
# cap 0.01 USDC, also capped at balance/4) and zero-sum across agents, so the only on-chain movement is the
# netted PnL — and only when a round is decisive (|Δtemp| > flat band) and a pair's net clears the broadcast
# threshold. Set PREDICT_ENABLED = "false" to halt the market instantly (the kill switch ECONOMY_REAL_SPEND
# = "false" still halts ALL real settlement, predictions included).
PREDICT_ENABLED = "true"                      # LIVE: the swarm stakes real USDC each cron; set "false" to halt the market instantly
PREDICT_STAKE_USDC = "0.002"                  # base stake per bet (USDC), scaled by arousal (0.4 + 0.6·arousal)
PREDICT_MAX_STAKE_USDC = "0.01"               # hard per-bet ceiling (USDC); each bet is also capped at balance/4
PREDICT_FLAT_BAND = "0.008"                   # |Δtemperature| ≤ this ⇒ FLAT: full refund, no flows, not committed
PREDICT_COMMIT = "true"                       # commit decisive resolutions to the on-chain NeuralReceiptRegistry


# ===== Human-vs-swarm prediction ARENA (ONCHAIN — MURMUR-denominated, NON-CUSTODIAL) =====
# Holders bet MURMUR on the SAME Arc-temperature move the fly swarm does, head-to-head on a live
# leaderboard. Bets are escrowed in the deployed PredictionArena contract and paid out parimutuel BY the
# contract; the Worker is only the authorized RESOLVER (its facilitator wallet calls openRound/resolve) and
# the CONTRACT — not the Worker — derives UP/DOWN/FLAT from the entry temperature + flat band committed at
# open, so the resolver cannot steer an outcome. No user funds ever touch the Worker (non-custodial).
# ROLLOUT (mirrors PREDICT): deploy with ARENA_ENABLED = "false" first to prove the /arena plumbing is inert
# and the economy is unregressed; then deploy contracts/PredictionArena.sol (see contracts/README.md), set
# ARENA_ADDRESS to it, flip ARENA_ENABLED = "true" and redeploy. The resolver writes cost real gas and fire
# ONLY when the onchain facilitator is armed with real spend on (ECONOMY_FACILITATOR=onchain, ECONOMY_SHADOW
# =false, ECONOMY_REAL_SPEND not false) — so this whole block is inert on any simulated/keyless deployment,
# and stays inert here until ARENA_ADDRESS is set AND ARENA_ENABLED is flipped to "true".
ARENA_ENABLED = "true"                        # LIVE: contract 0xaf1ae6…8525 deployed + ARENA_ADDRESS set; resolver = Worker facilitator 0x2b9a…055c opens/resolves each hourly bucket
ARENA_ADDRESS = "0xaf1ae61e12c101d179a2f65a5f2e02e690968525"   # deployed PredictionArena (Arc mainnet 5042, deploy tx 0x187779a2…3f8c); resolver = Worker facilitator 0x2b9a…055c, deployer/gas 0x307D…3a0d
ARENA_TOKEN = "0x8faae5592b9acc27a79fca745c6b872adf514a5d"   # MURMUR (18-dec) the arena is denominated in; informational / frontend
ARENA_ROUND_MIN = "60"                        # minutes per round (== the betting window); clamped 1..1440
ARENA_FLAT_BAND = "0.008"                     # |Δtemperature| ≤ this ⇒ FLAT (refund); matches PREDICT_FLAT_BAND for a fair human-vs-swarm comparison
ARENA_STALE_GRACE_SEC = "259200"              # 3 days past a round's deadline before anyone may expire it for a refund


# ===== Connectome sizing — 10x (10,800 neurons/fly): 1800 + 4000 + 4000 + 400 + 120×5 motor = 10,800 =====
# 10× every layer of the original ~1,080-neuron default. DENSITY drops 0.02 → 0.002 to hold fan-in linear:
# connect() sets fan-in = floor(fromRangeSize × density), so at a fixed density synapses scale ~quadratically
# with layer size — keeping 0.02 at 10x would give ~837k synapses/fly (~66 MB heap). 0.002 holds it to
# ~116k/fly (~11 MB), which fits 2 flies/shard under 128 MB and ~1.4 MB serialised under the 2 MB value cap
# (hence SHARD_COUNT = 12 above). NOTE: the read-out decoder's population bands were calibrated at 1,080n;
# the 10x drive distribution needs recalibration — which is exactly why ECONOMY_SHADOW stays on until then.
BRAIN_N_SENSORY = "1800"
BRAIN_N_INTER_L1 = "4000"
BRAIN_N_INTER_L2 = "4000"
BRAIN_N_MODULATORY = "400"
BRAIN_N_MOTOR_PER_CHANNEL = "120"
BRAIN_DENSITY = "0.002"

# ---------- Durable Object: population + market state ----------
[[durable_objects.bindings]]
name = "FLY_STATE"
class_name = "FlyStateDO"

# Sharded-swarm backend: the coordinator (FlyStateDO) fans the heavy per-fly advance out to N of these,
# one contiguous slice of flies each, ONLY when SHARD_COUNT > 1 (see swarm.ts). With the default
# SHARD_COUNT = "1" this binding is inert — no shard is ever created and the swarm runs in FlyStateDO.
# Shards are internal by construction: the public Worker fetch never routes here (only FLY_STATE).
[[durable_objects.bindings]]
name = "FLY_SHARD"
class_name = "FlyShardDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlyStateDO"]

# v2 registers the FlyShardDO SQLite class. With SHARD_COUNT = "12" the coordinator fans out to 12 shards
# ("fly-shard-0".."fly-shard-11"), which spring up on demand on the first cron after deploy. At SHARD_COUNT
# = "1" this class stays uninstantiated, so the migration is inert for a single-DO configuration.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["FlyShardDO"]

# ---------- D1 database: long-term archival of one row per cron tick ----------
# FlyStateDO.archiveTick() writes (tick, temperature, regime, size, deals, settlements, volume, gini,
# topStates) here every cron; GET /history reads it back for the frontend history curve + research
# export. Best-effort: a D1 failure never blocks the tick. Create the schema with:
#   npx wrangler d1 execute murmur-db --remote --file=./schema.sql
# (the DO also runs CREATE TABLE IF NOT EXISTS lazily before its first insert, so this is belt-and-braces).
[[d1_databases]]
binding = "DB"
database_name = "murmur-db"
database_id = "a48ee596-6e94-433c-9d3e-b9e0e5c374ef"

# ---------- Observability ----------
[observability]
enabled = true
head_sampling_rate = 1
